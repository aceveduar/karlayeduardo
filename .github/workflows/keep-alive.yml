name: Supabase Keep Alive

on:
  schedule:
    # Corre cada 3 días a las 12:00 UTC para evitar pausa por inactividad
    - cron: "0 12 */3 * *"
  workflow_dispatch: # Permite correrlo manualmente desde GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://kdpgdgulrekryxqtewtr.supabase.co/rest/v1/families?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase respondió con status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "ERROR: Supabase no respondió correctamente (status $STATUS)"
            exit 1
          fi
          echo "Ping exitoso — proyecto activo"
